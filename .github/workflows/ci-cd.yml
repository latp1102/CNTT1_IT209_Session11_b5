name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew check test

      - name: Build Docker image
        run: docker build -t springboot-mysql-api:v1 .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'springboot-mysql-api:v1'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker tag springboot-mysql-api:v1 ${{ secrets.DOCKERHUB_USERNAME }}/springboot-mysql-api:${{ github.sha }}
          docker tag springboot-mysql-api:v1 ${{ secrets.DOCKERHUB_USERNAME }}/springboot-mysql-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/springboot-mysql-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/springboot-mysql-api:latest

  cd-deploy:
    needs: ci-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/devops_exam/springboot-product-api || mkdir -p /home/devops_exam/springboot-product-api && cd /home/devops_exam/springboot-product-api
            docker compose pull
            docker compose up -d --remove-orphans
            for i in {1..12}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "DEPLOYMENT SUCCESSFUL"
                exit 0
              fi
              sleep 5
            done
            echo "DEPLOYMENT FAILED - ROLLED BACK"
            docker compose down
            docker compose up -d
            exit 1
